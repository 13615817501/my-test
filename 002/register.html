<!-- Client-side Interaction Script -->
<script>
    function togglePassword() {
      const pwdInput = document.getElementById('password-input');
      const eyeIcon = document.getElementById('eye-icon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.textContent = 'visibility';
      } else {
        pwdInput.type = 'password';
        eyeIcon.textContent = 'visibility_off';
      }
    }

    // Interactive UI feedback & simple validation mock
    const phoneInput = document.getElementById('phone-input');
    const pwdInput = document.getElementById('password-input');
    const termsCheckbox = document.getElementById('terms-checkbox');
    const registerBtn = document.getElementById('register-btn');
    const strength1 = document.getElementById('strength-1');
    const strength2 = document.getElementById('strength-2');
    const strength3 = document.getElementById('strength-3');
    const strengthText = document.getElementById('strength-text');
    const sendCodeBtn = document.getElementById('send-code-btn');

    phoneInput.addEventListener('input', (e) => {
      // Format or check length
      updateRegisterState();
    });

    pwdInput.addEventListener('input', (e) => {
      const val = e.target.value;
      let strength = 0;
      if (val.length >= 6) strength++;
      if (/[A-Z]/.test(val) || /[0-9]/.test(val)) strength++;
      if (/[^A-Za-z0-9]/.test(val)) strength++;

      strength1.className = 'h-1.5 flex-1 rounded-full transition-all ' + (strength >= 1 ? 'bg-tertiary-container' : 'bg-surface-variant');
      strength2.className = 'h-1.5 flex-1 rounded-full transition-all ' + (strength >= 2 ? 'bg-primary-container' : 'bg-surface-variant');
      strength3.className = 'h-1.5 flex-1 rounded-full transition-all ' + (strength >= 3 ? 'bg-primary' : 'bg-surface-variant');

      if (strength === 1) strengthText.textContent = '弱';
      else if (strength === 2) strengthText.textContent = '中';
      else if (strength >= 3) strengthText.textContent = '强';
      else strengthText.textContent = '密码强度';

      updateRegisterState();
    });

    // Handle checkbox custom click sync
    const customCheckboxBox = termsCheckbox.nextElementSibling;
    // We update state whenever inputs change
    function updateRegisterState() {
      const isPhoneValid = phoneInput.value.length === 11;
      const isPwdValid = pwdInput.value.length >= 6;
      const isChecked = termsCheckbox.checked;

      if (isPhoneValid && isPwdValid && isChecked) {
        registerBtn.removeAttribute('disabled');
        registerBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        registerBtn.classList.add('hover:bg-primary-container', 'active:scale-[0.99]');
      } else {
        registerBtn.setAttribute('disabled', 'true');
        registerBtn.classList.add('opacity-50', 'cursor-not-allowed');
        registerBtn.classList.remove('hover:bg-primary-container', 'active:scale-[0.99]');
      }
    }

    termsCheckbox.addEventListener('change', updateRegisterState);

    // Countdown mock for code button
    sendCodeBtn.addEventListener('click', () => {
      if (phoneInput.value.length !== 11) {
        // Shake or prompt
        phoneInput.focus();
        return;
      }
      let count = 60;
      sendCodeBtn.setAttribute('disabled', 'true');
      sendCodeBtn.classList.add('opacity-50');
      const timer = setInterval(() => {
        sendCodeBtn.textContent = count + 's后重试';
        count--;
        if (count < 0) {
          clearInterval(timer);
          sendCodeBtn.textContent = '获取验证码';
          sendCodeBtn.removeAttribute('disabled');
          sendCodeBtn.classList.remove('opacity-50');
        }
      }, 1000);
    });

    registerBtn.addEventListener('click', () => {
      if (!registerBtn.hasAttribute('disabled')) {
        // Delight effect: show success state
        registerBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> 正在注册...';
        setTimeout(() => {
          registerBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span> 注册成功！欢迎回家';
          registerBtn.classList.remove('bg-primary');
          registerBtn.classList.add('bg-secondary', 'text-on-secondary');
        }, 1200);
      }
    });
  </script>
