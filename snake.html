<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍌 贪吃蛇 · 香蕉果园</title>
<style>
  :root {
    --green-050: #f1f9f2;
    --green-100: #dcf0de;
    --green-200: #bfe3c6;
    --green-300: #93cf9f;
    --green-400: #63b678;
    --green-500: #43a057;
    --green-700: #5ed97f;
    --ink: #1f4230;
    --ink-soft: #4a7a5c;
    --red: #e63946;
    --red-light: #ff7b7b;
    --red-dark: #b8202c;
    --gold: #f5a300;
    --gold-dark: #b06e00;
    --panel: rgba(255, 255, 255, 0.72);
    --shadow: 0 10px 30px rgba(45, 115, 64, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 700px at 15% 10%, #eaf7ec 0%, rgba(234,247,236,0) 60%),
      radial-gradient(900px 600px at 85% 90%, #d6f0dc 0%, rgba(214,240,220,0) 62%),
      linear-gradient(160deg, var(--green-050) 0%, var(--green-100) 45%, var(--green-200) 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-x: hidden;
  }

  /* 背景飘落的树叶装饰 */
  .leaf {
    position: fixed;
    font-size: 26px;
    opacity: .35;
    pointer-events: none;
    animation: drift 14s linear infinite;
    filter: saturate(.9);
  }
  .leaf.l1 { top: -6%;  left: 6%;  animation-duration: 17s; }
  .leaf.l2 { top: -6%;  left: 26%; animation-duration: 21s; animation-delay: -4s; }
  .leaf.l3 { top: -6%;  left: 52%; animation-duration: 19s; animation-delay: -9s; }
  .leaf.l4 { top: -6%;  left: 74%; animation-duration: 23s; animation-delay: -13s; }
  .leaf.l5 { top: -6%;  left: 90%; animation-duration: 20s; animation-delay: -6s; }

  @keyframes drift {
    0%   { transform: translateY(-40px) rotate(0deg); }
    100% { transform: translateY(112vh) rotate(540deg); }
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ---------- 顶部标题 ---------- */
  header {
    text-align: center;
  }
  header h1 {
    font-size: clamp(24px, 6vw, 34px);
    letter-spacing: 2px;
    color: var(--green-700);
    text-shadow: 0 2px 0 rgba(255,255,255,.7);
  }
  header h1 .emoji { filter: drop-shadow(0 2px 3px rgba(0,0,0,.15)); }
  header p {
    margin-top: 4px;
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 1px;
  }

  /* ---------- 面板 ---------- */
  .panel {
    background: var(--panel);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 2px solid rgba(255,255,255,.85);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 14px;
  }

  /* ---------- 计分板 ---------- */
  .hud {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 12px;
  }
  .stat {
    background: linear-gradient(180deg, #ffffff 0%, #f2faf3 100%);
    border-radius: 14px;
    border: 1px solid var(--green-200);
    padding: 8px 6px;
    text-align: center;
    box-shadow: inset 0 1px 0 #fff, 0 2px 6px rgba(45,115,64,.08);
  }
  .stat .label {
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 1px;
  }
  .stat .value {
    font-size: 22px;
    font-weight: 700;
    color: var(--green-700);
    line-height: 1.25;
    font-variant-numeric: tabular-nums;
  }
  .stat.best .value { color: var(--gold); }

  /* ---------- 画布 ---------- */
  .stage {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    background: linear-gradient(180deg, #eaf7ea 0%, #dcf1dd 100%);
    border: 3px solid var(--green-300);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.6), 0 6px 18px rgba(45,115,64,.16);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
  }

  /* ---------- 遮罩层 ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 20px;
    background: rgba(240, 250, 242, .82);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    transition: opacity .22s ease, visibility .22s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .overlay .big { font-size: 52px; line-height: 1; animation: pop .35s ease; }
  .overlay h2 {
    font-size: 22px;
    color: var(--green-700);
    letter-spacing: 2px;
  }
  .overlay p { font-size: 13px; color: var(--ink-soft); line-height: 1.8; }

  @keyframes pop {
    0%   { transform: scale(.5); opacity: 0; }
    70%  { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); }
  }

  /* ---------- 按钮 ---------- */
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    outline: none;
  }
  .btn {
    padding: 11px 26px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
    background: linear-gradient(180deg, var(--red-light) 0%, var(--red) 55%, var(--red-dark) 100%);
    box-shadow: 0 5px 0 var(--red-dark), 0 8px 16px rgba(230, 57, 70, .32);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 var(--red-dark), 0 3px 8px rgba(230, 57, 70, .3);
  }
  .btn.ghost {
    color: var(--green-700);
    background: linear-gradient(180deg, #ffffff 0%, #eaf6ec 100%);
    box-shadow: 0 4px 0 var(--green-300), 0 6px 12px rgba(45,115,64,.16);
    font-weight: 600;
  }
  .btn.ghost:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-300); }

  /* ---------- 底部控制 ---------- */
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 12px;
  }

  .tips {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
    font-size: 12.5px;
    color: var(--ink-soft);
    flex-wrap: wrap;
  }
  kbd {
    display: inline-block;
    min-width: 20px;
    padding: 2px 6px;
    margin: 0 1px;
    border-radius: 6px;
    background: #fff;
    border: 1px solid var(--green-200);
    border-bottom-width: 2px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11.5px;
    color: var(--green-700);
  }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .dot.banana { background: #ffd23f; }
  .dot.gold   { background: var(--gold-dark); }

  /* ---------- 移动端方向键 ---------- */
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 52px);
    gap: 8px;
    justify-content: center;
    margin-top: 14px;
  }
  .dpad button {
    background: linear-gradient(180deg, #ffffff 0%, #e9f6ec 100%);
    border: 2px solid var(--green-200);
    border-radius: 14px;
    color: var(--green-700);
    font-size: 20px;
    line-height: 1;
    box-shadow: 0 4px 0 var(--green-200);
  }
  .dpad button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-200); }
  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 2; }
  .dpad .down  { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }

  @media (max-width: 620px), (pointer: coarse) {
    .dpad { display: grid; }
    .tips .desktop-hint { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .leaf { animation: none; }
  }
</style>
</head>
<body>

<div class="leaf l1">🍃</div>
<div class="leaf l2">🌿</div>
<div class="leaf l3">🍃</div>
<div class="leaf l4">🌱</div>
<div class="leaf l5">🍃</div>

<div class="wrap">
  <header>
    <h1><span class="emoji">🍌</span> 贪吃蛇 · 香蕉果园</h1>
    <p>吃掉黄香蕉，让小蛇越长越长！</p>
  </header>

  <div class="panel">
    <div class="hud">
      <div class="stat">
        <div class="label">得分</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="stat best">
        <div class="label">最高分</div>
        <div class="value" id="best">0</div>
      </div>
      <div class="stat">
        <div class="label">长度</div>
        <div class="value" id="len">3</div>
      </div>
    </div>

    <div class="stage" id="stage">
      <canvas id="cv" width="480" height="480"></canvas>

      <div class="overlay" id="overlay">
        <div class="big" id="ovIcon">🌱</div>
        <h2 id="ovTitle">准备好了吗？</h2>
        <p id="ovText">用方向键 / WASD 控制小蛇<br>吃到黄香蕉得分，吃到金香蕉有额外惊喜！</p>
        <button class="btn" id="ovBtn">开始游戏</button>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="btnStart">开始 / 继续</button>
      <button class="btn ghost" id="btnPause">暂停</button>
      <button class="btn ghost" id="btnReset">重新开始</button>
    </div>

    <div class="dpad">
      <button class="up"    data-dir="up"    aria-label="向上">▲</button>
      <button class="left"  data-dir="left"  aria-label="向左">◀</button>
      <button class="down"  data-dir="down"  aria-label="向下">▼</button>
      <button class="right" data-dir="right" aria-label="向右">▶</button>
    </div>

    <div class="tips">
      <div class="legend">
        <span><i class="dot banana"></i> 黄香蕉 +10</span>
        <span><i class="dot gold"></i> 金香蕉 +50（限时）</span>
      </div>
      <div class="desktop-hint">
        <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动
        · <kbd>空格</kbd> 暂停
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ==================== 常量配置 ====================
  const COLS = 20;          // 网格列数
  const ROWS = 20;          // 网格行数
  const CELL = 24;          // 单格像素
  const W = COLS * CELL;    // 画布宽
  const H = ROWS * CELL;    // 画布高

  const BASE_SPEED   = 150; // 初始步进毫秒
  const MIN_SPEED    = 60;  // 最快步进毫秒
  const SPEED_STEP   = 4;   // 每得 10 分提速毫秒
  const SCORE_BANANA      = 10;
  const SCORE_GOLD_BANANA = 50;

  const COLORS = {
    boardA:    '#e8f6ea',
    boardB:    '#ddf0e0',
    grid:      'rgba(99, 182, 120, 0.13)',
    snakeLight:'#ff8a8a',
    snakeMid:  '#ef5350',
    snakeDark: '#c62b38',
    snakeBelly:'#ffd9d4',
    banana:     '#ffd23f',
    bananaDark: '#e0a800',
    bananaTip:  '#8a5a20',
    stem:       '#7a4a2b',
    gold:       '#f5a300',
    goldDark:   '#b06e00',
    ink:       '#2a2a2a',
  };

  // ==================== 状态 ====================
  const cv  = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  const ui = {
    score:  document.getElementById('score'),
    best:   document.getElementById('best'),
    len:    document.getElementById('len'),
    overlay:document.getElementById('overlay'),
    ovIcon: document.getElementById('ovIcon'),
    ovTitle:document.getElementById('ovTitle'),
    ovText: document.getElementById('ovText'),
    ovBtn:  document.getElementById('ovBtn'),
    stage:  document.getElementById('stage'),
  };

  let snake, dir, dirQueue, banana, goldBanana;
  let score, best, alive, paused, started;
  let tickMs, acc, lastTime, reqId;
  let goldTimer = 0;
  let shake = 0;
  let particles = [];
  let popups = [];
  let tongueTimer = 0;

  // ==================== 最高分持久化 ====================
  const BEST_KEY = 'cute_snake_best';
  function loadBest() {
    try { return parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; }
    catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* 隐私模式忽略 */ }
  }
  best = loadBest();

  // ==================== 工具 ====================
  const rand = n => Math.floor(Math.random() * n);
  const cellKey = (x, y) => x + ',' + y;

  function occupied(cells, x, y, ignoreGold) {
    for (const s of cells) if (s.x === x && s.y === y) return true;
    if (!ignoreGold && goldBanana && goldBanana.x === x && goldBanana.y === y) return true;
    return false;
  }

  function randomFreeCell() {
    const tries = 400;
    for (let i = 0; i < tries; i++) {
      const x = rand(COLS), y = rand(ROWS);
      if (!occupied(snake, x, y) && !(goldBanana && goldBanana.x === x && goldBanana.y === y)) {
        return { x, y };
      }
    }
    return null;
  }

  // ==================== 游戏流程 ====================
  function reset() {
    const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
    snake = [
      { x: cx, y: cy },
      { x: cx - 1, y: cy },
      { x: cx - 2, y: cy },
    ];
    dir = { x: 1, y: 0 };
    dirQueue = [];
    score = 0;
    alive = true;
    paused = false;
    started = false;
    goldBanana = null;
    goldTimer = 0;
    particles = [];
    popups = [];
    shake = 0;
    tongueTimer = 0;
    tickMs = BASE_SPEED;
    acc = 0;
    lastTime = performance.now();
    banana = randomFreeCell();
    syncHud();
    showOverlay(
      '🌱', '准备好了吗？',
      '用方向键 / WASD 控制小蛇<br>吃到黄香蕉得分，吃到金香蕉有额外惊喜！', '开始游戏'
    );
  }

  function startGame() {
    if (!started || !alive) reset();
    started = true;
    paused = false;
    hideOverlay();
    lastTime = performance.now();
    acc = 0;
    if (!reqId) loop(lastTime);
  }

  function togglePause() {
    if (!started || !alive) return;
    paused = !paused;
    if (paused) {
      showOverlay('⏸️', '暂停中', '按「开始 / 继续」或空格键恢复游戏', '继续游戏');
    } else {
      hideOverlay();
      lastTime = performance.now();
    }
  }

  function gameOver() {
    alive = false;
    shake = 12;
    spawnBurst(snake[0].x, snake[0].y, 18, ['#ef5350', '#ff8a8a', '#c62b38']);
    if (score > best) { best = score; saveBest(best); }
    syncHud();
    showOverlay(
      '😵',
      '游戏结束',
      `本局得分 <b style="color:#e63946">${score}</b>　最高分 <b style="color:#ffb703">${best}</b><br>小蛇长到了 ${snake.length} 节`,
      '再玩一次'
    );
  }

  // ==================== HUD ====================
  function syncHud() {
    ui.score.textContent = score;
    ui.best.textContent = best;
    ui.len.textContent = snake ? snake.length : 0;
  }

  function showOverlay(icon, title, text, btn) {
    ui.ovIcon.textContent = icon;
    ui.ovTitle.textContent = title;
    ui.ovText.innerHTML = text;
    ui.ovBtn.textContent = btn;
    ui.overlay.classList.remove('hidden');
  }
  function hideOverlay() {
    ui.overlay.classList.add('hidden');
  }

  // ==================== 方向输入 ====================
  function setDir(d) {
    if (!d) return;
    // 参照点：队列末尾（没有则用当前方向），保证不会 180° 反向
    const ref = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (d.x === -ref.x && d.y === -ref.y) return;   // 反向，忽略
    if (d.x === ref.x && d.y === ref.y) return;    // 同向，忽略
    if (dirQueue.length >= 3) return;             // 缓冲上限
    dirQueue.push(d);
  }

  const KEYS = {
    ArrowUp:    { x: 0, y: -1 }, KeyW: { x: 0, y: -1 },
    ArrowDown:  { x: 0, y: 1 },  KeyS: { x: 0, y: 1 },
    ArrowLeft:  { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 },  KeyD: { x: 1, y: 0 },
  };

  window.addEventListener('keydown', e => {
    if (KEYS[e.code]) {
      e.preventDefault();
      if (!started || !alive) { startGame(); }
      setDir(KEYS[e.code]);
      return;
    }
    if (e.code === 'Space') {
      e.preventDefault();
      if (!started || !alive) startGame();
      else togglePause();
    }
    if (e.code === 'KeyR') { e.preventDefault(); reset(); startGame(); }
  });

  // 触屏滑动
  let touchStart = null;
  cv.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  cv.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) {
      if (!started || !alive) startGame();
      return;
    }
    if (!started || !alive) startGame();
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 });
    else setDir(dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 });
  }, { passive: true });

  // 屏幕方向键
  document.querySelectorAll('.dpad button').forEach(btn => {
    const map = { up: {x:0,y:-1}, down: {x:0,y:1}, left: {x:-1,y:0}, right: {x:1,y:0} };
    const handler = e => {
      e.preventDefault();
      if (!started || !alive) startGame();
      setDir(map[btn.dataset.dir]);
    };
    btn.addEventListener('touchstart', handler, { passive: false });
    btn.addEventListener('mousedown', handler);
  });

  // ==================== 逻辑更新 ====================
  function step() {
    if (dirQueue.length) dir = dirQueue.shift();

    const head = snake[0];
    const nx = head.x + dir.x;
    const ny = head.y + dir.y;

    // 撞墙
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) { gameOver(); return; }
    // 撞自己（尾巴会移走，所以不检查最后一节）
    for (let i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === nx && snake[i].y === ny) { gameOver(); return; }
    }

    snake.unshift({ x: nx, y: ny });

    let grew = false;

    // 吃黄香蕉
    if (banana && nx === banana.x && ny === banana.y) {
      grew = true;
      score += SCORE_BANANA;
      tongueTimer = 260;
      spawnBurst(banana.x, banana.y, 12, ['#ffd23f', '#fff3b0', '#e0a800', '#43a057']);
      popups.push({ x: banana.x, y: banana.y, text: '+' + SCORE_BANANA, life: 700, color: '#b8860b' });
      banana = randomFreeCell();
      tickMs = Math.max(MIN_SPEED, BASE_SPEED - Math.floor(score / 10) * SPEED_STEP);
      maybeSpawnGoldBanana();
    }

    // 吃金香蕉
    if (goldBanana && nx === goldBanana.x && ny === goldBanana.y) {
      grew = true;
      score += SCORE_GOLD_BANANA;
      tongueTimer = 320;
      spawnBurst(goldBanana.x, goldBanana.y, 22, ['#ffb703', '#ffd166', '#fff3b0', '#e0a800']);
      popups.push({ x: goldBanana.x, y: goldBanana.y, text: '+' + SCORE_GOLD_BANANA, life: 900, color: '#d98b00' });
      goldBanana = null;
      goldTimer = 0;
    }

    // 没吃到 → 缩尾；吃到 → 保留尾节（身体变长）
    if (!grew) snake.pop();

    if (score > best) { best = score; saveBest(best); }
    syncHud();
  }

  function maybeSpawnGoldBanana() {
    if (goldBanana || Math.random() > 0.28) return;
    const c = randomFreeCell();
    if (c) { goldBanana = c; goldTimer = 6500; }
  }

  // ==================== 粒子 ====================
  function spawnBurst(gx, gy, count, palette) {
    const cx = gx * CELL + CELL / 2;
    const cy = gy * CELL + CELL / 2;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1.2 + Math.random() * 3.4;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 0.9,
        life: 520 + Math.random() * 320,
        max: 840,
        size: 2 + Math.random() * 3.4,
        color: palette[(Math.random() * palette.length) | 0],
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.24,
      });
    }
  }

  function updateFx(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt * 0.06;
      p.y += p.vy * dt * 0.06;
      p.vy += 0.16 * dt * 0.06;
      p.rot += p.vr * dt * 0.06;
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      popups[i].life -= dt;
      popups[i].y -= dt * 0.012;
      if (popups[i].life <= 0) popups.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 0.03);
    if (tongueTimer > 0) tongueTimer -= dt;
    if (goldBanana) {
      goldTimer -= dt;
      if (goldTimer <= 0) { goldBanana = null; goldTimer = 0; }
    }
  }

  // ==================== 绘制 ====================
  function drawBoard() {
    ctx.fillStyle = COLORS.boardA;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = COLORS.boardB;
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if ((x + y) % 2 === 0) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }
    // 网格线
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 1; x < COLS; x++) { ctx.moveTo(x * CELL + .5, 0); ctx.lineTo(x * CELL + .5, H); }
    for (let y = 1; y < ROWS; y++) { ctx.moveTo(0, y * CELL + .5); ctx.lineTo(W, y * CELL + .5); }
    ctx.stroke();
  }

  // 沿圆弧画一条粗细渐变的带子（香蕉的果肉 / 高光）
  function strokeTaperedArc(r, a0, a1, w0, w1, steps) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let i = 0; i < steps; i++) {
      const t = (i + 0.5) / steps;
      ctx.lineWidth = w0 + (w1 - w0) * t;
      ctx.beginPath();
      ctx.arc(0, 0, r, a0 + (a1 - a0) * (i / steps), a0 + (a1 - a0) * ((i + 1) / steps));
      ctx.stroke();
    }
  }

  function drawBanana(gx, gy, golden, t) {
    const cx = gx * CELL + CELL / 2;
    const cy = gy * CELL + CELL / 2;
    const bob = Math.sin(t / 260) * 1.6;
    const y = cy + bob;
    const R = CELL * 0.40;        // 弧线半径
    const W0 = CELL * 0.36;       // 果柄端厚度
    const W1 = CELL * 0.13;       // 果尖端厚度
    const A0 = Math.PI * 0.26;    // 起始角（果柄端，右侧）
    const A1 = Math.PI * 0.74;    // 结束角（果尖端，左侧）
    const tilt = -0.20;           // 整体倾斜

    // 影子
    ctx.fillStyle = 'rgba(45,115,64,.16)';
    ctx.beginPath();
    ctx.ellipse(cx + 1.5, gy * CELL + CELL - 4, R * 0.72, R * 0.20, 0, 0, Math.PI * 2);
    ctx.fill();

    if (golden) {
      // 金香蕉柔光（画在香蕉底下）
      const pulse = 0.5 + 0.5 * Math.sin(t / 180);
      const rr = R * (1.55 + pulse * 0.35);
      const halo = ctx.createRadialGradient(cx, y, R * 0.45, cx, y, rr);
      halo.addColorStop(0, 'rgba(255,215,0,.34)');
      halo.addColorStop(0.6, 'rgba(255,200,0,.16)');
      halo.addColorStop(1, 'rgba(255,200,0,0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(cx, y, rr, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(cx, y - CELL * 0.02);
    ctx.rotate(tilt);

    const endStemX = R * Math.cos(A0), endStemY = R * Math.sin(A0);
    const endTipX = R * Math.cos(A1), endTipY = R * Math.sin(A1);

    // 果柄（果肉一端向上伸出的小棕柄）
    ctx.strokeStyle = COLORS.stem;
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(endStemX, endStemY);
    ctx.quadraticCurveTo(endStemX + 2.0, endStemY - 2.6, endStemX + 1.1, endStemY - 5.6);
    ctx.stroke();

    // 果尖（另一端收成小尖）
    ctx.strokeStyle = golden ? COLORS.goldDark : COLORS.bananaTip;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(endTipX, endTipY);
    ctx.quadraticCurveTo(endTipX - 1.6, endTipY - 2.2, endTipX - 1.0, endTipY - 4.2);
    ctx.stroke();

    // 果肉主体：一条由粗到细的新月弧
    const g = ctx.createLinearGradient(-R, -R, R, R);
    g.addColorStop(0, golden ? '#fff8dc' : '#fff3b0');
    g.addColorStop(0.5, golden ? COLORS.gold : COLORS.banana);
    g.addColorStop(1, golden ? COLORS.goldDark : COLORS.bananaDark);

    // 外轮廓
    ctx.strokeStyle = golden ? 'rgba(150,90,0,.55)' : 'rgba(163,110,0,.50)';
    strokeTaperedArc(R, A0, A1, W0 + 1.6, W1 + 1.2, 26);

    // 果肉
    ctx.strokeStyle = g;
    strokeTaperedArc(R, A0, A1, W0, W1, 26);

    // 内侧高光
    ctx.strokeStyle = 'rgba(255,255,255,.50)';
    strokeTaperedArc(R - W0 * 0.22, A0 + 0.06, A1 - 0.06, W0 * 0.24, W1 * 0.5, 20);

    ctx.restore();
  }

  function drawSnake(t) {
    const n = snake.length;
    const head = snake[0];
    const d = { x: dir.x, y: dir.y };

    // ===== 身体：单条闭合缎带（无自交、自转角圆滑、头尾收圆）=====
    const px0 = i => snake[i].x * CELL + CELL / 2;
    const py0 = i => snake[i].y * CELL + CELL / 2;
    const halfW = i => CELL * (0.42 - 0.13 * (i / Math.max(1, n - 1)));
    const dirAt = i => {                       // 第 i 段 -> i+1 段的单位方向
      const dx = px0(i + 1) - px0(i), dy = py0(i + 1) - py0(i);
      const L = Math.hypot(dx, dy) || 1;
      return { x: dx / L, y: dy / L };
    };
    const angOf = (x, y) => Math.atan2(y, x);

    function buildRibbon(pad) {
      const p = new Path2D();
      const w = i => halfW(i) + pad;
      const Lp = [], Rp = [];
      for (let i = 0; i < n; i++) {
        const dPrev = i > 0 ? dirAt(i - 1) : dirAt(0);
        const dNext = i < n - 1 ? dirAt(i) : dirAt(n - 2);
        let nx = -(dPrev.y + dNext.y), ny = (dPrev.x + dNext.x);
        const m = Math.hypot(nx, ny) || 1;
        nx /= m; ny /= m;
        Lp.push([px0(i) + nx * w(i), py0(i) + ny * w(i)]);
        Rp.push([px0(i) - nx * w(i), py0(i) - ny * w(i)]);
      }
      // 左侧：头 -> 尾
      p.moveTo(Lp[0][0], Lp[0][1]);
      for (let i = 1; i < n - 1; i++) {
        p.quadraticCurveTo(Lp[i][0], Lp[i][1],
          (Lp[i][0] + Lp[i + 1][0]) / 2, (Lp[i][1] + Lp[i + 1][1]) / 2);
      }
      p.lineTo(Lp[n - 1][0], Lp[n - 1][1]);
      // 尾部圆帽
      const dT = dirAt(n - 2);
      const aLT = angOf(dT.x, dT.y) + Math.PI / 2;
      p.arc(px0(n - 1), py0(n - 1), w(n - 1), aLT, aLT - Math.PI, true);
      // 右侧：尾 -> 头
      p.lineTo(Rp[n - 1][0], Rp[n - 1][1]);
      for (let i = n - 2; i > 0; i--) {
        p.quadraticCurveTo(Rp[i][0], Rp[i][1],
          (Rp[i][0] + Rp[i - 1][0]) / 2, (Rp[i][1] + Rp[i - 1][1]) / 2);
      }
      p.lineTo(Rp[0][0], Rp[0][1]);
      // 头部圆帽
      const dH = dirAt(0);
      const aLH = angOf(dH.x, dH.y) + Math.PI / 2;
      p.arc(px0(0), py0(0), w(0), aLH + Math.PI, aLH + Math.PI * 2, false);
      p.closePath();
      return p;
    }

    // 描边（外圈半线宽可见）
    const bodyPath = buildRibbon(0);
    ctx.strokeStyle = COLORS.snakeDark;
    ctx.lineWidth = 4.5;
    ctx.lineJoin = 'round';
    ctx.stroke(bodyPath);

    // 躯干本体
    ctx.save();
    ctx.clip(bodyPath);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, COLORS.snakeLight);
    bg.addColorStop(0.45, COLORS.snakeMid);
    bg.addColorStop(1, COLORS.snakeDark);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    // 背部高光
    ctx.strokeStyle = 'rgba(255,255,255,.30)';
    ctx.lineWidth = CELL * 0.15;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const x = px0(i) - 1.5, y = py0(i) - 2.0;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    // 腹部浅色
    ctx.strokeStyle = 'rgba(255,222,216,.30)';
    ctx.lineWidth = CELL * 0.10;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const x = px0(i) + 1.8, y = py0(i) + 2.4;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();

    // 尾巴尖
    if (n > 1) {
      const tx = px0(n - 1), ty = py0(n - 1);
      const ang = Math.atan2(ty - py0(n - 2), tx - px0(n - 2));
      ctx.save();
      ctx.translate(tx, ty);
      ctx.rotate(ang);
      ctx.fillStyle = COLORS.snakeDark;
      ctx.beginPath();
      ctx.moveTo(0, -CELL * 0.13);
      ctx.quadraticCurveTo(CELL * 0.30, 0, 0, CELL * 0.13);
      ctx.quadraticCurveTo(-CELL * 0.08, 0, 0, -CELL * 0.13);
      ctx.fill();
      ctx.restore();
    }

    // ===== 头部（局部坐标：+x 为前进方向，+y 为右侧）=====
    const hx = head.x * CELL + CELL / 2;
    const hy = head.y * CELL + CELL / 2;
    const hr = CELL * 0.52;
    const ang = Math.atan2(d.y, d.x);

    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(ang);

    // 舌头（伸向前方）
    if (tongueTimer > 0) {
      const tx0 = hr * 0.85, tx1 = hr + CELL * 0.40;
      ctx.strokeStyle = '#ff5a76';
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tx0, 0);
      ctx.lineTo(tx1, 0);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(tx1, 0);
      ctx.lineTo(tx1 + 5, -4);
      ctx.moveTo(tx1, 0);
      ctx.lineTo(tx1 + 5, 4);
      ctx.stroke();
    }

    // 头
    const hg = ctx.createRadialGradient(-hr * 0.32, -hr * 0.42, hr * 0.2, 0, 0, hr * 1.2);
    hg.addColorStop(0, '#ff9c9c');
    hg.addColorStop(0.5, COLORS.snakeMid);
    hg.addColorStop(1, COLORS.snakeDark);
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.ellipse(0, 0, hr, hr * 0.96, 0, 0, Math.PI * 2);
    ctx.fill();

    // 后脑勺的小卷毛
    ctx.strokeStyle = COLORS.snakeDark;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-hr * 0.72, 0);
    ctx.quadraticCurveTo(-hr * 1.18, -hr * 0.40, -hr * 0.98, -hr * 0.66);
    ctx.stroke();

    // 腮红
    ctx.fillStyle = 'rgba(255,140,150,.55)';
    ctx.beginPath();
    ctx.ellipse(hr * 0.10, -hr * 0.60, hr * 0.22, hr * 0.15, 0, 0, Math.PI * 2);
    ctx.ellipse(hr * 0.10, hr * 0.60, hr * 0.22, hr * 0.15, 0, 0, Math.PI * 2);
    ctx.fill();

    // 眼睛（大眼睛，瞳孔朝向行进方向）
    const eyeR = hr * 0.30;
    for (const s of [-1, 1]) {
      const ex = hr * 0.26, ey = s * hr * 0.40;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(ex, ey, eyeR, eyeR * 1.06, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.08)';
      ctx.lineWidth = 1;
      ctx.stroke();
      // 瞳孔
      ctx.fillStyle = COLORS.ink;
      ctx.beginPath();
      ctx.ellipse(ex + eyeR * 0.32, ey, eyeR * 0.50, eyeR * 0.56, 0, 0, Math.PI * 2);
      ctx.fill();
      // 眼神光
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      ctx.beginPath();
      ctx.ellipse(ex + eyeR * 0.32 - eyeR * 0.16, ey - eyeR * 0.18, eyeR * 0.17, eyeR * 0.17, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // 微笑（向前凸出的小弧）
    ctx.strokeStyle = 'rgba(90,20,26,.85)';
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(hr * 0.32, 0, hr * 0.22, -Math.PI / 2, Math.PI / 2);
    ctx.stroke();

    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      const a = Math.max(0, Math.min(1, p.life / p.max));
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.size > 3.6) {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      }
      ctx.restore();
    }
  }

  function drawPopups() {
    for (const p of popups) {
      const a = Math.max(0, Math.min(1, p.life / 500));
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.font = 'bold 15px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = 'rgba(255,255,255,.9)';
      ctx.lineWidth = 3;
      ctx.strokeText(p.text, p.x * CELL + CELL / 2, p.y * CELL + CELL / 2);
      ctx.fillText(p.text, p.x * CELL + CELL / 2, p.y * CELL + CELL / 2);
      ctx.restore();
    }
  }

  function render(t) {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    }
    drawBoard();
    if (banana) drawBanana(banana.x, banana.y, false, t);
    if (goldBanana) drawBanana(goldBanana.x, goldBanana.y, true, t);
    if (snake && snake.length) drawSnake(t);
    drawParticles();
    drawPopups();
    ctx.restore();
  }

  // ==================== 主循环 ====================
  function loop(now) {
    const dt = Math.min(50, now - lastTime);
    lastTime = now;

    if (started && alive && !paused) {
      acc += dt;
      while (acc >= tickMs) {
        acc -= tickMs;
        step();
        if (!alive) break;
      }
    }
    updateFx(dt);
    render(now);
    reqId = requestAnimationFrame(loop);
  }

  // ==================== 按钮绑定 ====================
  ui.ovBtn.addEventListener('click', () => startGame());
  document.getElementById('btnStart').addEventListener('click', () => startGame());
  document.getElementById('btnPause').addEventListener('click', () => togglePause());
  document.getElementById('btnReset').addEventListener('click', () => { reset(); startGame(); });

  // 失去焦点自动暂停
  window.addEventListener('blur', () => {
    if (started && alive && !paused) togglePause();
  });

  // ==================== 启动 ====================
  reset(); // reset 内部会展示开始界面
  loop(performance.now());
})();
</script>
</body>
</html>
